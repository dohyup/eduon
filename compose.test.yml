services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eduon_test
      POSTGRES_PASSWORD: eduon_local_test_only
      POSTGRES_DB: eduon_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduon_test -d eduon_test"]
      interval: 3s
      retries: 10
