<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="48%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="glow-top" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(124 28) rotate(135) scale(96)">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wing-grad" x1="40" y1="44" x2="120" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="bridge-grad" x1="48" y1="96" x2="112" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="soft-shadow" x="20" y="20" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#090D16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base (160x160) -->
  <rect width="160" height="160" rx="36" fill="url(#bg-grad)" />
  <rect width="160" height="160" rx="36" fill="url(#glow-top)" />
  <rect x="1.5" y="1.5" width="157" height="157" rx="34.5" stroke="#93C5FD" stroke-opacity="0.22" stroke-width="3" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="160" />
    <line x1="80" y1="0" x2="80" y2="160" />
    <line x1="120" y1="0" x2="120" y2="160" />
    <line x1="0" y1="40" x2="160" y2="40" />
    <line x1="0" y1="80" x2="160" y2="80" />
    <line x1="0" y1="120" x2="160" y2="120" />
  </g>

  <!-- Central Connected Learning Symbol (Book + Live Bridge + Nodes) -->
  <g filter="url(#soft-shadow)">
    <!-- Open Book / Learning Wings + Apex -->
    <path
      d="M44 98L80 38L116 98L80 78L44 98Z"
      fill="url(#wing-grad)"
    />
    <!-- Learning Bridge Arc ("배움이음터") -->
    <path
      d="M52 94C62 76 98 76 108 94"
      stroke="url(#bridge-grad)"
      stroke-width="7.5"
      stroke-linecap="round"
    />
    <!-- Top Knowledge Node -->
    <circle cx="80" cy="38" r="11" fill="#60A5FA" stroke="#FFFFFF" stroke-width="3.5" />
    <!-- Left Academy Node -->
    <circle cx="44" cy="98" r="9.5" fill="#93C5FD" stroke="#1E3A8A" stroke-width="3" />
    <!-- Right Student Live Node (Emerald Live Accent) -->
    <circle cx="116" cy="98" r="9.5" fill="#34D399" stroke="#064E3B" stroke-width="3" />
    <!-- Center Connection Core -->
    <circle cx="80" cy="82" r="6.5" fill="#FFFFFF" />
  </g>

  <!-- EDUON Wordmark Badge at Bottom -->
  <text
    x="80"
    y="134"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"
    font-size="20"
    font-weight="800"
    letter-spacing="1.5"
  >
    EDU<tspan fill="#60A5FA">ON</tspan>
  </text>
</svg>
