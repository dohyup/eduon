name: EDUON P1 through P3
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eduon_test
          POSTGRES_PASSWORD: eduon_ci_only
          POSTGRES_DB: eduon_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eduon_test -d eduon_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eduon_test:eduon_ci_only@127.0.0.1:5432/eduon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run db:migrate:test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:e2e:p2
      - run: npm run test:e2e:p3
